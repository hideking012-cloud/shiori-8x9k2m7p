                  <div class="relative w-full pt-[56.25%] rounded-xl overflow-hidden bg-slate-900 mb-3">

                  </p>
                </div>
                <a href="https://www.youtube.com/results?search_query=%E7%94%B0%E4%BB%A3%E5%B3%B6+%E7%8C%AB%E3%81%AE%E5%B3%B6+%E8%A6%B3%E5%85%89" target="_blank" rel="noopener noreferrer" class="mt-3 inline-flex items-center justify-center gap-1.5 text-xs font-extrabold text-[#1B365D] bg-slate-100 hover:bg-slate-200 py-2 rounded-xl transition">
                  <i class="fa-brands fa-youtube text-red-600 text-sm"></i>

        `
      },

      // P10: 帰りの仙台駅おすすめお土産＆駅弁
      {
        shortTitle: "P10 仙台お土産・駅弁",
        fullTitle: "P10. 帰りの仙台駅おすすめお土産＆駅弁",
        icon: "fa-bag-shopping",
        render: () => `
          <div class="h-full flex flex-col justify-between bg-[#FAF8F5] p-5 sm:p-8">
            <div class="border-b-2 border-[#B8860B]/30 pb-3 mb-4 flex flex-wrap items-center justify-between gap-2">
              <div>
                <span class="inline-block bg-[#B8860B] text-white text-xs font-black px-3 py-0.5 rounded-md mb-1">SENDAI SOUVENIRS & EKIBEN</span>
                <h2 class="font-serif text-xl sm:text-3xl font-black text-[#1B365D]">仙台駅おすすめお土産＆新幹線車内グルメ</h2>
              </div>
              <span class="text-xs font-extrabold bg-amber-100 text-amber-950 px-3 py-1.5 rounded-xl border border-amber-300">
                17:24発「やまびこ64号」乗車前に購入！
              </span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 my-auto">
              <!-- 王道銘菓・スイーツ -->
              <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-sm space-y-2.5">
                <h3 class="font-serif text-base font-black text-[#C84B31] border-b border-slate-100 pb-2">
                  <i class="fa-solid fa-cookie-bite mr-1.5"></i>王道の銘菓・スイーツ
                </h3>
                <ul class="space-y-2 text-xs text-slate-700 leading-relaxed">
                  <li><strong>菓匠三全「萩の月」：</strong>ふんわりカステラと濃厚カスタードの不動の定番土産。</li>
                  <li><strong>シーラカンス モナカ：</strong>小豆餡にフランス産発酵バターとゲランド塩を挟んだ甘じょっぱい大人気モナカ（エスパル東館等）。</li>
                  <li><strong>白松がモナカ本舗「白松がモナカ」：</strong>香ばしい皮と上品な餡が魅力の老舗銘菓。</li>
                </ul>
              </div>

              <!-- ずんだ系＆おつまみ -->
              <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-sm space-y-2.5">
                <h3 class="font-serif text-base font-black text-[#235347] border-b border-slate-100 pb-2">
                  <i class="fa-solid fa-leaf mr-1.5"></i>ずんだ系＆牛たんおつまみ
                </h3>
                <ul class="space-y-2 text-xs text-slate-700 leading-relaxed">
                  <li><strong>喜久水庵「喜久福」：</strong>ずんだ餡と生クリームを包んだ大福（保冷剤対応）。</li>
                  <li><strong>ずんだ茶寮「ずんだシェイク」：</strong>新幹線ホームへ向かう前の移動のお供に最高！</li>
                  <li><strong>伊達の牛たん本舗「牛たんしぐれ煮」・陣中「牛タン仙台ラー油」・阿部蒲鉾店「笹かまぼこ／チーズボール」</strong></li>
                </ul>
              </div>

              <!-- 新幹線車内の駅弁 -->
              <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-sm space-y-2.5">
                <h3 class="font-serif text-base font-black text-[#1B365D] border-b border-slate-100 pb-2">
                  <i class="fa-solid fa-bento-box mr-1.5"></i>帰りの新幹線で楽しむ駅弁
                </h3>
                <ul class="space-y-2 text-xs text-slate-700 leading-relaxed">
                  <li><strong>こばやし「網焼き牛たん弁当」：</strong>紐を引くと蒸気で温まる加熱式容器の定番駅弁。</li>
                  <li><strong>伯養軒「炙りえんがわずし」「はらこめし」：</strong>宮城ならではの海の幸を味わえる人気弁当。</li>
                </ul>
                <div class="bg-amber-50 border border-amber-200 rounded-xl p-2.5 text-[11px] text-amber-950 mt-2">
                  <strong>★乗車前メモ：</strong>帰りの「やまびこ64号」10号車（グランクラス）は<strong>シートのみの営業（車内販売・飲料軽食サービスなし）</strong>のため、仙台駅改札内外でお弁当・地酒・お茶を買い込んでからご乗車ください！
                </div>
              </div>
            </div>
          </div>
        `
      },

      // P11: 最終持ち物＆直前チェックリスト
      {
        shortTitle: "P11 チェックリスト",
        fullTitle: "P11. 最終持ち物＆直前チェックリスト",
        icon: "fa-list-check",
        render: () => {
          const doneCount = checklistItems.filter(i => checklistState[i.id]).length;
          return `
            <div class="h-full flex flex-col justify-between bg-[#FAF8F5] p-5 sm:p-8">
              <div class="border-b-2 border-[#1B365D]/15 pb-3 mb-4 flex flex-wrap items-center justify-between gap-2">
                <div>
                  <span class="inline-block bg-[#C84B31] text-white text-xs font-black px-3 py-0.5 rounded-md mb-1">FINAL CHECKLIST</span>
                  <h2 class="font-serif text-xl sm:text-3xl font-black text-[#1B365D]">出発前・当日の最終チェックリスト</h2>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-xs sm:text-sm font-black bg-[#1B365D] text-[#E6C36A] px-3.5 py-1.5 rounded-xl">
                    達成状況：${doneCount} / ${checklistItems.length}
                  </span>
                  <button onclick="resetAllChecklist()" class="text-xs text-slate-500 hover:text-[#C84B31] underline cursor-pointer">
                    リセット
                  </button>
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-3 my-auto">
                ${checklistItems.map(item => {
                  const checked = !!checklistState[item.id];
                  return `
                    <label onclick="toggleChecklistItem('${item.id}')" class="bg-white rounded-2xl border-2 ${checked ? 'border-emerald-400 bg-emerald-50/40' : 'border-slate-200 hover:border-[#1B365D]/40'} p-3.5 shadow-sm cursor-pointer flex items-start gap-3 transition select-none">
                      <input type="checkbox" ${checked ? 'checked' : ''} onchange="event.stopPropagation(); toggleChecklistItem('${item.id}')" class="w-5 h-5 mt-0.5 rounded text-emerald-600 focus:ring-emerald-500 cursor-pointer flex-shrink-0">
                      <div class="min-w-0">
                        <div class="flex items-center gap-2 flex-wrap mb-0.5">
                          <span class="text-[10px] font-black px-2 py-0.5 rounded ${checked ? 'bg-emerald-600 text-white' : 'bg-[#1B365D] text-[#E6C36A]'}">${item.tag}</span>
                          <span class="text-xs sm:text-sm font-extrabold ${checked ? 'line-through text-slate-400' : 'text-slate-900'}">${item.title}</span>
                        </div>
                        <p class="text-[11px] sm:text-xs text-slate-600 leading-relaxed">${item.note}</p>
                      </div>
                    </label>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }
      }
    ];

    // ---------- 4. ナビゲーション＆描画制御 ----------
    function renderNavigationUI() {
      const pillContainer = document.getElementById('pill-container');
      pillContainer.innerHTML = pages.map((p, idx) => {
        const isCurrent = idx === currentPage && viewMode === 'slide';
        return `
          <button onclick="navigateToPage(${idx})" class="flex-shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-bold transition cursor-pointer ${isCurrent ? 'bg-[#E6C36A] text-slate-950 font-black shadow-xs' : 'text-slate-300 hover:text-white hover:bg-white/10'}">
            ${p.shortTitle}
          </button>
        `;
      }).join('');

      const tocList = document.getElementById('toc-list');
      tocList.innerHTML = pages.map((p, idx) => {
        const isCurrent = idx === currentPage;
        return `
          <button onclick="navigateToPage(${idx}); toggleTocDrawer(false);" class="w-full text-left px-3.5 py-2.5 rounded-xl flex items-center gap-3 transition cursor-pointer ${isCurrent ? 'bg-[#1B365D] text-white font-extrabold shadow-sm' : 'hover:bg-white text-slate-700 font-bold'}">
            <i class="fa-solid ${p.icon} w-4 text-center ${isCurrent ? 'text-[#E6C36A]' : 'text-[#C84B31]'}"></i>
            <span class="text-xs sm:text-sm truncate">${p.fullTitle}</span>
          </button>
        `;
      }).join('');

      const doneCount = checklistItems.filter(i => checklistState[i.id]).length;
      const totalCount = checklistItems.length;
      const headerBadge = document.getElementById('header-check-badge');
      const drawerBadge = document.getElementById('drawer-check-badge');
      if (headerBadge) headerBadge.textContent = `準備 ${doneCount}/${totalCount}`;
      if (drawerBadge) drawerBadge.textContent = `${doneCount}/${totalCount} 完了`;

      const pageCounter = document.getElementById('page-counter');
      if (pageCounter) pageCounter.textContent = `P${currentPage + 1} / ${pages.length}`;
    }

    function renderActiveView() {
      renderNavigationUI();

      if (viewMode === 'slide') {
        const stage = document.getElementById('slide-stage');
        stage.innerHTML = `<div class="slide-animate h-full flex-grow flex flex-col">${pages[currentPage].render()}</div>`;
      } else {
        const scrollView = document.getElementById('scroll-view');
        scrollView.innerHTML = pages.map((p, idx) => `
          <section id="scroll-page-${idx}" class="bg-white rounded-3xl border-2 border-[#1B365D]/15 shadow-lg overflow-hidden">
            ${p.render()}
          </section>
        `).join('');
      }
    }

    function switchMode(mode) {
      viewMode = mode;
      const slideView = document.getElementById('slide-view');
      const scrollView = document.getElementById('scroll-view');
      const topPillBar = document.getElementById('top-pill-bar');
      const btnSlide = document.getElementById('btn-mode-slide');
      const btnScroll = document.getElementById('btn-mode-scroll');

      if (mode === 'slide') {
        slideView.classList.remove('hidden');
        scrollView.classList.add('hidden');
        topPillBar.classList.remove('hidden');
        btnSlide.className = 'px-2.5 sm:px-3 py-1.5 rounded-lg text-[11px] sm:text-xs font-extrabold bg-[#B8860B] text-white shadow-sm transition cursor-pointer flex items-center gap-1';
        btnScroll.className = 'px-2.5 sm:px-3 py-1.5 rounded-lg text-[11px] sm:text-xs font-bold text-slate-300 hover:text-white transition cursor-pointer flex items-center gap-1';
      } else {
        slideView.classList.add('hidden');
        scrollView.classList.remove('hidden');
        topPillBar.classList.add('hidden');
        btnScroll.className = 'px-2.5 sm:px-3 py-1.5 rounded-lg text-[11px] sm:text-xs font-extrabold bg-[#B8860B] text-white shadow-sm transition cursor-pointer flex items-center gap-1';
        btnSlide.className = 'px-2.5 sm:px-3 py-1.5 rounded-lg text-[11px] sm:text-xs font-bold text-slate-300 hover:text-white transition cursor-pointer flex items-center gap-1';
      }
      renderActiveView();
    }

    function navigateToPage(idx) {
      if (idx < 0 || idx >= pages.length) return;
      currentPage = idx;
      if (viewMode === 'scroll') {
        renderActiveView();
        const target = document.getElementById(`scroll-page-${idx}`);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        renderActiveView();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function nextPage() {
      navigateToPage((currentPage + 1) % pages.length);
    }

    function prevPage() {
      navigateToPage((currentPage - 1 + pages.length) % pages.length);
    }

    function toggleTocDrawer(open) {
      const backdrop = document.getElementById('toc-drawer-backdrop');
      const drawer = document.getElementById('toc-drawer');
      if (open) {
        backdrop.classList.remove('hidden');
        drawer.classList.remove('-translate-x-full');
      } else {
        backdrop.classList.add('hidden');
        drawer.classList.add('-translate-x-full');
      }
    }

    // ---------- 5. マップ＆チェックリスト操作 ----------
    function pickMatsushimaSpot(id) {
      activeMatsushimaId = id;
      renderActiveView();
    }

    function stepMatsushimaSpot(delta) {
      const next = ((activeMatsushimaId - 1 + delta + matsushimaSpots.length) % matsushimaSpots.length) + 1;
      activeMatsushimaId = next;
      renderActiveView();
    }

    function setMatsushimaZoom(zoom) {
      matsushimaZoomed = zoom;
      renderActiveView();
    }

    function toggleMatsuVisit(id) {
      matsushimaVisited[id] = !matsushimaVisited[id];
      localStorage.setItem('shiori_matsu_visit_v5', JSON.stringify(matsushimaVisited));
      renderActiveView();
    }

    function pickTashiroSpot(id) {
      activeTashiroId = id;
      renderActiveView();
    }

    function stepTashiroSpot(delta) {
      const next = ((activeTashiroId - 1 + delta + tashiroSpots.length) % tashiroSpots.length) + 1;
      activeTashiroId = next;
      renderActiveView();
    }

    function setTashiroZoom(zoom) {
      tashiroZoomed = zoom;
      renderActiveView();
    }

    function toggleTashiroVisit(id) {
      tashiroVisited[id] = !tashiroVisited[id];
      localStorage.setItem('shiori_tashiro_visit_v5', JSON.stringify(tashiroVisited));
      renderActiveView();
    }

    function toggleChecklistItem(id) {
      checklistState[id] = !checklistState[id];
      localStorage.setItem('shiori_checklist_v5', JSON.stringify(checklistState));
      renderActiveView();
    }

    function resetAllChecklist() {
      checklistState = {};
      localStorage.removeItem('shiori_checklist_v5');
      renderActiveView();
    }

    // ---------- 6. キーボード＆スワイプ操作 ----------
    document.addEventListener('keydown', (e) => {
      if (viewMode !== 'slide') return;
      if (e.key === 'ArrowRight') nextPage();
      if (e.key === 'ArrowLeft') prevPage();
    });

    let touchStartX = 0;
    let touchEndX = 0;
    const stageEl = document.getElementById('slide-stage');
    stageEl.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });
    stageEl.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      const diff = touchStartX - touchEndX;
      if (Math.abs(diff) > 55) {
        if (diff > 0) nextPage();
        else prevPage();
      }
    }, { passive: true });

    // ---------- 7. 初期化 ----------
    window.addEventListener('DOMContentLoaded', () => {
      renderActiveView();
    });
  </script>
</body>
</html>
